# Publishes a release on each version tag (git tag v0.1.0 && git push origin v0.1.0); a tag with a
# suffix (v0.1.0-alpha) is marked as a prerelease. Tag-only trigger and one Linux runner, which
# cross-compiles every platform, keep Actions usage minimal.
# Actions are pinned by commit: a moved tag cannot change what runs with the release permissions.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  # Signed build provenance (Sigstore, through GitHub) for the binaries and the image.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci && npm run build
        working-directory: web
      - run: go vet ./... && sh scripts/coverage.sh
      # Browser smoke test, with the runner's Chrome.
      - run: node e2e/smoke.mjs
        working-directory: web

      - name: Build every platform
        run: |
          mkdir out
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name=linos-$os-$arch
            [ "$os" = windows ] && name=linos.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "out/$name" ./cmd/linos
          done

      # Windows signing with SignPath (free for open source), skipped until it is set up:
      # repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
      # and secret SIGNPATH_API_TOKEN. The signed linos.exe replaces the unsigned one.
      - id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linos-unsigned
          path: out/linos.exe
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out

      # Each binary gets a signed provenance: built by this workflow, from this commit. Checked with
      # gh attestation verify <file> --repo gwenaf/Linos
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: out/*

      - name: Publish the release
        run: |
          prerelease=
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" out/* --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      # Docker image for self-hosting (linux/amd64), see the Dockerfile.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The version tag, and latest for a final release.
      - id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linos
          tags=$image:$GITHUB_REF_NAME
          [[ "$GITHUB_REF_NAME" != *-* ]] && tags=$tags,$image:latest
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      # The image's signed provenance is pushed next to it. Checked with
      # gh attestation verify oci://ghcr.io/gwenaf/linos:<version> --repo gwenaf/Linos
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
