# Checks each pull request: formatting, go vet and 100 % test coverage (scripts/coverage.sh).
# Go only, on pull requests only, to keep Actions usage minimal; the release workflow runs the
# same checks plus the browser smoke test.
# Actions are pinned by commit: a moved tag cannot change what runs.
name: checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && sh scripts/coverage.sh
